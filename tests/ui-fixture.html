<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/ff8-garden/style.css"><style>body{margin:0;background:radial-gradient(ellipse at 50% 10%,#45647a,#0a1525);font-family:Arial;color:white}#top-bar{height:35px;text-align:center;background:#0007;letter-spacing:25px;padding:5px;box-sizing:border-box}#sheld{display:flex;flex-direction:column}#chat{flex:1;overflow:auto}.mes{display:flex;gap:12px;line-height:1.8}.avatar img{width:55px}.ch_name{font-weight:bold}.mes_text{font-size:17px}#send_form{padding:15px}#send_textarea{width:100%;border:0;font-size:17px;padding:10px}#extensions_settings2{position:fixed;display:none;z-index:99;top:150px;background:#111;padding:20px}</style></head><body><div id="top-bar">☷ ⚡ A ◉ ♟ ▧ ▣ ☻</div><div id="sheld"><div id="chat"><div class="mes"><div><div class="ch_name">Quistis</div><div class="mes_text">Il Garden è silenzioso. Quistis ti attende vicino alla biblioteca, con una nuova missione da affidarti.</div></div></div><div class="mes"><div><div class="ch_name">Tu</div><div class="mes_text">Controllo le Junction prima di partire.</div></div></div></div><form id="send_form"><textarea id="send_textarea" placeholder="Scrivi la tua azione..."></textarea></form></div><div id="extensions_settings2"></div><script>
window.handlers={};window.saved=0;window.prompts={};window.notices=[];
window.context={name1:'Lucas',characterId:0,chatId:'test-chat',getCurrentChatId:()=>context.chatId,chatMetadata:{},extensionSettings:{},chat:[],eventTypes:{MESSAGE_SWIPED:'swipe',MESSAGE_EDITED:'edit',MESSAGE_DELETED:'delete',APP_READY:'ready',CHAT_CHANGED:'chat',PERSONA_CHANGED:'persona',GENERATION_STARTED:'start',GENERATION_ENDED:'end'},eventSource:{on:(event,fn)=>{(handlers[event]??=[]).push(fn);if(event==='ready')setTimeout(fn,0);}},saveMetadata:async()=>{saved++;localStorage.setItem('qa-metadata',JSON.stringify(context.chatMetadata));},saveSettingsDebounced:()=>{},setExtensionPrompt:(key,prompt)=>prompts[key]=prompt};
context.chatMetadata=JSON.parse(localStorage.getItem('qa-metadata')||'{}');
window.SillyTavern={getContext:()=>context};window.toastr={info:t=>notices.push(t),error:t=>notices.push('ERROR: '+t)};window.emit=async(type)=>{for(const fn of handlers[type]||[])await fn();};
</script><script type="module" src="/ff8-garden/index.js"></script></body></html>
